[env]
RUNEWIDTH_EASTASIAN = "0"

[general]
import = [
#    "~/.config/alacritty/themes/themes/challenger_deep.toml"
"~/.config/alacritty/themes/themes/xterm.toml"
]

[font]
size = 15.0

[font.bold]
family = "Sauce Code Pro Nerd Font"
style = "Bold"

[font.bold_italic]
family = "Sauce Code Pro Nerd Font"
style = "Bold Italic"

[font.italic]
family = "Sauce Code Pro Nerd Font"
style = "Italic"

[font.normal]
family = "Sauce Code Pro Nerd Font"
style = "Regular"

[[mouse.bindings]]
action = "PasteSelection"
mouse = "Right"

[selection]
save_to_clipboard = true

[window]
opacity = 0.8

[keyboard]
bindings = [
   { key = "Return", mods = "Control|Shift", action = "SpawnNewInstance" },
]
